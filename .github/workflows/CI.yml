name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags: '*'
  workflow_dispatch:

concurrency:
  # Skip intermediate builds: all builds except for builds on the `main` branch
  # Cancel intermediate builds: only pull request builds
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref != 'refs/heads/main' || github.run_number }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  actions: write
  contents: read

jobs:
  finalize:
    needs: [format, test, jet]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    if: always()

    steps:
      - run: |
          echo format: ${{ needs.format.result }}
          echo test: ${{ needs.test.result }}
          echo jet: ${{ needs.jet.result }}

      - run: exit 1
        if: |
          (needs.format.result != 'success') ||
          (needs.test.result != 'success') ||
          (needs.jet.result != 'success')

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: just
      - name: Install runic
        run: |
          julia --project=@runic --startup-file=no -e 'using Pkg; Pkg.add("Runic")'
          cat > runic <<'SCRIPT'
          #!/bin/sh
          export JULIA_LOAD_PATH="@runic"
          exec julia --startup-file=no -e 'using Runic; exit(Runic.main(ARGS))' -- "$@"
          SCRIPT
          chmod +x runic
          echo "$PWD" >> "$GITHUB_PATH"
      - run: just fmt-check

  jet:
    runs-on: ubuntu-latest
    # Sound analysis is an inference workload rather than a test, and the longest single
    # check by a wide margin, so it gets a process and a heap to itself. A cell that stops
    # making progress is stuck, and the default six-hour limit turns that into hours of a
    # dead runner.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The ratchet limits in `jet/run.jl` are counts one Julia and JET pairing produces,
      # so the gate runs on the current stable release and nowhere else. JET ships empty
      # stubs on Julia versions it does not support, which is the other reason nightly has
      # nothing to run here.
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: '1'

      - uses: julia-actions/cache@a7bed9df697e5d7309d68afe7542a87621a8b6c8 # v3.3.0

      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: just

      - run: just jet
        env:
          # JET's sound analysis churns tens of gigabytes through the collector. Julia
          # sizes its heap from physical memory, so the 16 GB Linux runner lets that heap
          # grow until the runner process itself is starved and the job dies mid-run with
          # no logs.
          JULIA_HEAP_SIZE_HINT: '6G'

  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    # A cell that stops making progress is stuck, and the default six-hour limit turns that
    # into hours of a dead runner. JET has an environment and a job of its own, so what is
    # left here is the suite under coverage.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version:
          # Dendro uses the `public` keyword, so the floor is Julia 1.11. `min`
          # resolves the compat floor; `lts` (1.10) is below it.
          - 'min'
          - '1'
          - 'nightly'
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: ${{ matrix.version }}

      - uses: julia-actions/cache@a7bed9df697e5d7309d68afe7542a87621a8b6c8 # v3.3.0

      - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1.7.0

      - uses: julia-actions/julia-runtest@6e050c8013b833b1195105ff2fce9cd802f53271 # v1.12.0
        continue-on-error: ${{ matrix.version == 'nightly' }}

      - uses: julia-actions/julia-processcoverage@03114f09f119417c3242a9fb6e0b722676aedf38 # v1.2.2

      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
